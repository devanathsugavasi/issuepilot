analysis:
  summary: get_dashboard does not check that current_user owns account_id (IDOR).
  expected_behavior: Non-owners receive Forbidden.
  actual_behavior: Any user can read any account's balance.
  acceptance_criteria:
    - Requesting another user's account raises Forbidden.
    - Owners can still view their own dashboard.
    - Unknown accounts still raise KeyError.
  relevant_files: [app/dashboard.py, tests/test_dashboard.py]
  security_relevant: true
  sufficient_information: true
plan:
  proposed_change: Compare account["owner"] with current_user in get_dashboard and raise Forbidden on mismatch.
  files_to_change: [app/dashboard.py, tests/test_dashboard.py]
  test_plan: [Add a regression test asserting Forbidden for a non-owner.]
  security_considerations: [Check ownership after the existence check so unknown IDs keep their current behavior.]
patches:
  - summary: Enforce account ownership in get_dashboard and add a regression test.
    edits:
      - path: app/dashboard.py
        search: |2
                  raise KeyError(account_id)
        replace: |2
                  raise KeyError(account_id)
              if account["owner"] != current_user:
                  raise Forbidden(account_id)
      - path: tests/test_dashboard.py
        search: "from app.dashboard import get_dashboard\n"
        replace: "from app.dashboard import Forbidden, get_dashboard\n"
      - path: tests/test_dashboard.py
        search: |2
              def test_unknown_account(self):
        replace: |2
              def test_other_users_account_is_forbidden(self):
                  with self.assertRaises(Forbidden):
                      get_dashboard("alice", "acct-2")

              def test_unknown_account(self):
